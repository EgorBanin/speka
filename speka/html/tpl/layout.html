<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{if .Name}}{{.Name}}{{else}}Speka{{end}}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, sans-serif;
            color: #1a1a1a;
            background: #fafafa;
        }
        .layout {
            display: flex;
            min-height: 100vh;
        }
        .menu {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 240px;
            overflow-y: auto;
            padding: 1.5rem 1rem;
            background: #fff;
            border-right: 1px solid #e5e5e5;
        }
        .menu h1 {
            margin: 0 0 0.5rem;
            font-size: 1.1rem;
        }
        .menu .speka-desc {
            margin: 0 0 1rem;
            font-size: 0.85rem;
            color: #666;
        }
        .menu ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .menu li { margin: 0.35rem 0; }
        .menu a {
            color: #2563eb;
            text-decoration: none;
            font-size: 0.95rem;
            word-break: break-all;
        }
        .menu a:hover { text-decoration: underline; }
        .content {
            margin-left: 240px;
            flex: 1;
            padding: 1.5rem 2rem;
            max-width: 960px;
        }
        .method {
            margin-bottom: 2.5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #e5e5e5;
        }
        .method h2 {
            margin: 0 0 0.75rem;
            font-size: 1.35rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .method-desc {
            margin: 0 0 1rem;
            color: #444;
            line-height: 1.5;
        }
        .tabs { position: relative; }
        .tab-radio {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            margin: 0;
        }
        .tab-bar {
            display: flex;
            gap: 0.15rem;
        }
        .tab-bar label {
            position: relative;
            top: 1px;
            padding: 0.45rem 0.85rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #666;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            user-select: none;
        }
        .tab-bar label:hover { color: #1a1a1a; }
        .tabs > .tab-radio:nth-of-type(1):focus-visible ~ .tab-bar > label:nth-of-type(1),
        .tabs > .tab-radio:nth-of-type(2):focus-visible ~ .tab-bar > label:nth-of-type(2),
        .tabs > .tab-radio:nth-of-type(3):focus-visible ~ .tab-bar > label:nth-of-type(3) {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }
        .tabs > .tab-radio:nth-of-type(1):checked ~ .tab-bar > label:nth-of-type(1),
        .tabs > .tab-radio:nth-of-type(2):checked ~ .tab-bar > label:nth-of-type(2),
        .tabs > .tab-radio:nth-of-type(3):checked ~ .tab-bar > label:nth-of-type(3) {
            color: #1a1a1a;
            background: #fff;
            border-color: #e5e5e5;
            border-bottom-color: #fff;
        }
        .tab-panels {
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            background: #fff;
            overflow: hidden;
        }
        .tab-panel { display: none; }
        .tabs > .tab-radio:nth-of-type(1):checked ~ .tab-panels > .tab-panel:nth-child(1),
        .tabs > .tab-radio:nth-of-type(2):checked ~ .tab-panels > .tab-panel:nth-child(2),
        .tabs > .tab-radio:nth-of-type(3):checked ~ .tab-panels > .tab-panel:nth-child(3) {
            display: block;
        }
        .param {
            display: grid;
            grid-template-columns: minmax(8rem, 1.2fr) 6rem minmax(8rem, 1fr);
            gap: 0.75rem;
            padding: 0.55rem 0.9rem;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9rem;
            align-items: baseline;
        }
        .param:last-child { border-bottom: none; }
        .param-name {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-weight: 600;
        }
        .param-required { color: #b91c1c; }
        .param-kind {
            color: #666;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.85rem;
        }
        .param-example {
            color: #166534;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.85rem;
            word-break: break-all;
        }
        .param-children {
            grid-column: 1 / -1;
            margin-left: 1rem;
            border-left: 2px solid #eee;
        }
        .param-children .param {
            border-bottom-color: #f5f5f5;
        }
        .error {
            padding: 0.55rem 0.9rem;
            border-bottom: 1px solid #f0f0f0;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .error:last-child { border-bottom: none; }
        .empty {
            padding: 0.75rem 0.9rem;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="layout">
    {{template "menu" .}}
    <main class="content">
        {{range .Methods}}
        {{template "method" .}}
        {{end}}
    </main>
</div>
</body>
</html>
